<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- La tarjeta og:image de NomiCheck: el hero de la portada, en 1200x630.
       Colores de marca (apps/web/src/index.css): midnight #0b1120, la
       variante #16203a, la acción índigo #5b50e8/#6f66ee, ámbar #f59e0b.
       El PNG servido (public/og.png) se regenera de este fuente:
         rsvg-convert -w 1200 -h 630 og.svg -o public/og.png
       Vive fuera de public/ a propósito: se sirve el PNG, no el fuente. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="sello-g" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6f66ee"/>
      <stop offset="1" stop-color="#4a3fd0"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#fondo)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- El sello, variante gradiente (el mismo dibujo del favicon) -->
  <g transform="translate(96 96) scale(1.875)">
    <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#sello-g)"/>
    <path d="M18 33 L28.5 43.5 L51 20" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="51" cy="20" r="5" fill="#f59e0b"/>
  </g>

  <text x="240" y="172" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" letter-spacing="-1">NomiCheck</text>

  <text x="96" y="330" font-family="Helvetica, Arial, sans-serif" font-size="96" font-weight="bold" fill="#ffffff" letter-spacing="-2">¿Te pagaron bien?</text>

  <text x="96" y="410" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#94a3b8">Tu nómina colombiana, verificada con la ley vigente —</text>
  <text x="96" y="458" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#94a3b8">cada línea citada a su artículo. Gratis y sin registro.</text>

  <text x="96" y="552" font-family="Helvetica, Arial, sans-serif" font-size="27" font-weight="bold" fill="#a5b4fc" letter-spacing="3">NOMICHECK.YNT.CODES</text>
  <text x="700" y="552" font-family="Helvetica, Arial, sans-serif" font-size="27" fill="#64748b">cálculo determinístico · salida firmada</text>
</svg>
