# Las 279 pruebas y el typecheck de los tres workspaces, en cada push y PR.
#
# Hasta el 2026-07-29 este repo no tenía CI: las pruebas corrían cuando alguien
# se acordaba. Una suite que nadie corre se ve exactamente igual que una suite
# verde.
#
# Nada de esto necesita red ni credenciales. Lo que SÍ las necesita —el deploy
# al VPS (`deploy.sh`), y las sondas contra producción que viven en el repo
# `nomicheck_ops`— queda afuera a propósito: en CI su rojo hablaría del servidor
# o del RPC, no del commit que lo disparó.

name: ci

on:
  push:
  pull_request:
  # Semanal, y SOLO para el audit de dependencias. Una vulnerabilidad nueva no
  # la publica un commit nuestro: aparece sola, un martes, en una librería que
  # no tocamos hace meses. Atarla a `push` haría que un rojo culpe al commit
  # equivocado — y peor, que un repo sin actividad deje de mirarse.
  schedule:
    - cron: "23 7 * * 1"

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Ni la versión de pnpm ni la de Node se escriben acá: salen de
      # `package.json` (`packageManager` y `engines.node`), que ya es donde las
      # busca el resto del mundo. Un segundo lugar con la versión es un lugar
      # más para desincronizarse.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Los dos pasos que siguen existen por la MISMA razón: hay artefactos
      # generados que en local ya están de una corrida anterior y en un clon
      # limpio no. Es la trampa clásica de un CI nuevo — el árbol de desarrollo
      # tiene estado que el repositorio no tiene.

      # `@pv/reglas` se resuelve por `main: ./dist/index.js`, así que hay que
      # COMPILARLO ANTES de typechequear o probar nada que lo importe. No es
      # teórico: verificado moviendo `packages/reglas/dist` fuera del árbol —
      # sin él, `pnpm -r typecheck` sale 2 y `pnpm -r test` sale 1.
      - name: compilar reglas (los demás lo importan por dist/)
        run: pnpm --filter '@pv/reglas' build

      # Los tipos del cliente de Prisma se GENERAN del schema; no están en el
      # repo. Sin esto, `apps/api` no compila: `Prisma.PrismaClientKnownRequestError`
      # y `Prisma.InputJsonValue` no existen, y los callbacks de `$transaction`
      # caen a `any` implícito — 24 errores de tipos.
      #
      # Esto lo encontró la primera corrida REAL del workflow, no la simulación
      # local: acá el cliente ya estaba generado de antes, así que la simulación
      # daba verde sobre un árbol que no era el que ve CI.
      #
      # Va como PASO EXPLÍCITO y no como `postinstall` de `apps/api`. Se intentó
      # con el hook y rompió el build de Docker: el `Dockerfile` corre
      # `pnpm install` en la línea 35, ANTES de copiar `apps/api` en la 39, así
      # que el postinstall se ejecutaba sin `schema.prisma` a la vista y abortaba
      # la imagen entera. El Dockerfile ya hacía este mismo generate en su línea
      # 42, en el momento correcto.
      #
      # La lección: un hook corre donde no lo llamaste. Un paso con nombre corre
      # donde se lee.
      - name: generar el cliente de Prisma (no está versionado)
        run: pnpm --filter '@pv/api' exec prisma generate

      # `apps/web` NO tenía script `typecheck` hasta el 2026-07-29, así que
      # `pnpm -r typecheck` se saltaba en silencio el workspace más grande
      # —12.101 líneas—. Y su `tsconfig.json` es solo `references` con
      # `files: []`: un `tsc --noEmit` ahí sale limpio **sin mirar un archivo**,
      # que es la misma trampa que el tsconfig de la raíz. Por eso su script es
      # `tsc -b --noEmit`, en modo build, que sí sigue las referencias.
      - name: typecheck de los tres workspaces
        run: pnpm --recursive typecheck

      - name: pruebas
        run: pnpm --recursive test

      - name: lint del front
        run: pnpm --filter '@pv/web' lint

      # ── Vulnerabilidades: SOLO las que llegan al servidor ────────────────
      #
      # `--prod` no es para bajar el listón: es lo único que mide la superficie
      # real. El Dockerfile hace `pnpm deploy --prod`, así que vitest, vite y
      # esbuild no viajan a producción — sus avisos son de esta máquina y de
      # este runner, no del box que cobra.
      #
      # Medido el 2026-08-10, la primera vez que se corrió: 11 avisos en total,
      # 1 crítico. En producción, dos — y uno era `ip-address` por debajo de
      # `express-rate-limit`, o sea justo abajo del tope por IP que se había
      # arreglado ese mismo día. Un bump lo cerró.
      #
      # Falla el job a propósito: en producción el número correcto es cero, y
      # cualquier otro es una decisión que alguien tiene que tomar mirándola.
      - name: sin vulnerabilidades conocidas en producción
        run: pnpm audit --prod --audit-level=low

  # ── La imagen se construye ACÁ, no en el VPS ────────────────────────────────
  #
  # Historia, 2026-07-29: cinco intentos de deploy murieron en `pnpm install`
  # dentro del build en el VPS. Su enlace baja tarballs a 3 KiB/s, y el chequeo
  # de cadena de suministro de pnpm 11 —491 entradas contra el registro— tardaba
  # 14 minutos y expiraba. Se le subió el timeout, se cacheó el store, y aun así
  # no alcanzó: el problema no era ningún timeout, era descargar 491 paquetes
  # por ese enlace en cada build. La mayoría ni le sirven a producción — vitest,
  # jsdom, los bindings de oxlint para seis plataformas — porque son para
  # COMPILAR, no para correr.
  #
  # Acá el runner tiene red rápida y es amd64 nativo, como el VPS. El VPS pasa a
  # bajar UNA imagen ya construida en vez de 491 paquetes.
  #
  # Esto cierra además el hueco que dejó pasar un postinstall roto hasta el
  # deploy: el CI daba verde sin construir la imagen, así que un Dockerfile roto
  # no se veía hasta desplegar. Ahora un push que rompa la imagen sale rojo acá.
  publicar-imagen:
    # Solo tras pasar las pruebas, y nunca desde un PR (un PR de un fork no debe
    # poder publicar una imagen que producción va a bajar).
    needs: verificar
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/batch-stateless')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Las VITE_* van como build-arg porque Vite las incrusta en el bundle en
      # tiempo de BUILD. Son claves publicables (el bundle servido ya las
      # expone); viven como variables del repo para no escribirlas acá.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nomicheck-api:latest
            ghcr.io/${{ github.repository_owner }}/nomicheck-api:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
