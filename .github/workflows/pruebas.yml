# La puerta del código: el monorepo corre sus suites y la auditoría de
# dependencias en el runner de GitHub en cada push — lejos de producción
# (Lightsail) y del standby. Mismo patrón que el resto de la casa.
name: pruebas

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: dependencias
        run: pnpm install --frozen-lockfile

      # En una máquina fresca el cliente de Prisma no existe (y pnpm no corre
      # postinstalls ajenos): sin esto, sus clases de error no son constructores
      # y media suite de la API revienta en cascada.
      - name: prisma generate
        run: pnpm --filter '@pv/api' exec prisma generate

      # Mismo motivo, otro paquete: @pv/api importa @pv/mcp por sus exports
      # (./dist), y en una máquina fresca ese dist no existe — los dos archivos
      # de la suite que lo importan mueren al resolver. En el Mac pasaba en
      # verde por el dist de builds viejos, y por eso este workflow nació rojo
      # y nadie lo vio en local.
      - name: build @pv/mcp
        run: pnpm --filter '@pv/mcp' build

      - name: suites
        run: pnpm test

      - name: auditoría de dependencias
        run: pnpm audit --prod --audit-level=high
