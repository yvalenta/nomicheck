# La puerta del código: el monorepo corre sus suites y la auditoría de
# dependencias en el runner de GitHub en cada push — lejos de producción
# (Lightsail) y del standby. Mismo patrón que el resto de la casa.
name: pruebas

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: dependencias
        run: pnpm install --frozen-lockfile

      # En una máquina fresca el cliente de Prisma no existe (y pnpm no corre
      # postinstalls ajenos): sin esto, sus clases de error no son constructores
      # y media suite de la API revienta en cascada.
      - name: prisma generate
        run: pnpm --filter '@pv/api' exec prisma generate

      - name: suites
        run: pnpm test

      - name: auditoría de dependencias
        run: pnpm audit --prod --audit-level=high
